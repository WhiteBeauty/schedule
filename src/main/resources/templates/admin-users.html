<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('settings', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Пользователи</h1>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <a class="topbar-bell" th:href="@{/notifications}" aria-label="Уведомления">
        <span th:replace="~{fragments/icons :: bell}"></span>
    </a>
</div>

<div th:fragment="pageContent" class="app-content">
    <style>
        .role-badge {
            display: inline-block; padding: 4px 10px; border-radius: var(--radius-pill);
            font-size: 11.5px; font-weight: 700;
        }
        .role-admin { background: var(--color-danger-bg); color: #7d160d; }
        .role-teacher { background: #E1EEF1; color: #0a4f61; }
        .audit-row { font-size: 13.5px; }
    </style>

    <p class="page-heading-sub" style="margin:0;">
        Права администратора можно выдать только вручную, отсюда. Самостоятельная
        регистрация с ролью администратора невозможна.
    </p>

    <div class="segmented" style="width:fit-content;">
        <button type="button" class="active" id="tabUsers" onclick="switchTab('users')">Пользователи</button>
        <button type="button" id="tabAudit" onclick="switchTab('audit')">Журнал изменений</button>
    </div>

    <div class="card" id="panelUsers">
        <table class="data-table">
            <thead><tr><th>Пользователь</th><th>Email</th><th>Роль</th><th>Действия</th></tr></thead>
            <tbody id="usersBody"><tr><td colspan="4"><span class="skeleton skeleton-line short"></span></td></tr></tbody>
        </table>
    </div>

    <div class="card" id="panelAudit" style="display:none;">
        <table class="data-table">
            <thead><tr><th>Когда</th><th>Действие</th><th>Кто выполнил</th><th>Над кем</th></tr></thead>
            <tbody id="auditBody"><tr><td colspan="4"><span class="skeleton skeleton-line short"></span></td></tr></tbody>
        </table>
    </div>

    <script th:inline="javascript">
    const currentUserId = /*[[${currentUserId}]]*/ null;

    function switchTab(tab) {
        document.getElementById('panelUsers').style.display = tab === 'users' ? '' : 'none';
        document.getElementById('panelAudit').style.display = tab === 'audit' ? '' : 'none';
        document.getElementById('tabUsers').classList.toggle('active', tab === 'users');
        document.getElementById('tabAudit').classList.toggle('active', tab === 'audit');
        if (tab === 'audit') loadAudit();
    }

    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const body = document.getElementById('usersBody');
        body.innerHTML = '';

        users.forEach(u => {
            const isAdminRole = u.role === 'ADMIN';
            const roleBadge = isAdminRole
                ? '<span class="role-badge role-admin">Администратор</span>'
                : '<span class="role-badge role-teacher">Преподаватель</span>';

            let actionBtn;
            if (isAdminRole) {
                actionBtn = String(u.id) === String(currentUserId)
                    ? '<span class="text-muted">Это вы</span>'
                    : '<button type="button" class="btn btn-sm btn-secondary" onclick="demote(' + u.id + ', this)">Снять права администратора</button>';
            } else {
                actionBtn = '<button type="button" class="btn btn-sm" onclick="promote(' + u.id + ', this)">Назначить администратором</button>';
            }

            const tr = document.createElement('tr');
            const name = (u.firstName || '') + ' ' + (u.lastName || '');
            tr.innerHTML =
                '<td>' + (name.trim() || u.username) + '</td>' +
                '<td>' + u.email + '</td>' +
                '<td>' + roleBadge + '</td>' +
                '<td>' + actionBtn + '</td>';
            body.appendChild(tr);
        });
    }

    async function promote(id, btn) {
        if (!confirm('Назначить этого пользователя администратором? У него появится полный доступ к системе.')) return;
        btn.disabled = true;
        const res = await fetch('/api/admin/users/' + id + '/promote', { method: 'POST' });
        if (res.ok) {
            loadUsers();
            showToast('Права администратора назначены', 'success');
        } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Не удалось выполнить действие', 'danger');
            btn.disabled = false;
        }
    }

    async function demote(id, btn) {
        if (!confirm('Снять права администратора с этого пользователя?')) return;
        btn.disabled = true;
        const res = await fetch('/api/admin/users/' + id + '/demote', { method: 'POST' });
        if (res.ok) {
            loadUsers();
            showToast('Права администратора сняты', 'success');
        } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Не удалось выполнить действие', 'danger');
            btn.disabled = false;
        }
    }

    async function loadAudit() {
        const res = await fetch('/api/admin/users/audit-log');
        const logs = await res.json();
        const body = document.getElementById('auditBody');
        body.innerHTML = '';

        if (!logs.length) {
            body.innerHTML = '<tr><td colspan="4" class="text-muted">Записей пока нет</td></tr>';
            return;
        }

        const actionLabels = { PROMOTE_TO_ADMIN: 'Назначен администратором', DEMOTE_FROM_ADMIN: 'Права сняты' };
        logs.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = 'audit-row';
            tr.innerHTML =
                '<td>' + formatDate(log.createdAt) + '</td>' +
                '<td>' + (actionLabels[log.action] || log.action) + '</td>' +
                '<td>' + log.actorUsername + '</td>' +
                '<td>' + log.targetUsername + '</td>';
            body.appendChild(tr);
        });
    }

    function formatDate(s) {
        if (!s) return '';
        try { return new Date(s).toLocaleString('ru-RU'); } catch (e) { return s; }
    }

    loadUsers();
    </script>
</div>
</body>
</html>
