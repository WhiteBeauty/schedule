<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('settings', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Кураторство</h1>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <label class="select-control">
        Учебный год:
        <select id="curYearSelect">
            <option th:each="y : ${#numbers.sequence(defaultYear - 2, defaultYear)}"
                    th:value="${y}" th:text="${y} + '/' + ${y + 1}" th:selected="${y == defaultYear}"></option>
        </select>
    </label>
    <button type="button" class="btn" id="assignOpenBtn">Назначить куратора</button>
    <a class="topbar-bell" th:href="@{/notifications}" aria-label="Уведомления">
        <span th:replace="~{fragments/icons :: bell}"></span>
    </a>
</div>

<div th:fragment="pageContent" class="app-content">
    <div class="cur-stats">
        <div class="metric-card"><div class="metric-label">Групп всего</div><div class="metric-value" id="statTotal">0</div></div>
        <div class="metric-card"><div class="metric-label">С куратором</div><div class="metric-value" id="statWith">0</div></div>
        <div class="metric-card" id="statWithoutCard"><div class="metric-label">Без куратора</div><div class="metric-value" id="statWithout">0</div></div>
        <div class="metric-card"><div class="metric-label">Средний % выполнения</div><div class="metric-value" id="statAvg">0%</div></div>
    </div>

    <div class="card">
        <div class="cur-admin-filters" style="margin-bottom:12px;">
            <input type="search" id="curSearch" placeholder="Группа или преподаватель">
            <select id="curTeacherFilter"><option value="">Все кураторы</option></select>
            <label><input type="checkbox" id="curOnlyFree"> Только без куратора</label>
        </div>
        <div class="table-scroll">
            <table class="data-table">
                <thead>
                <tr><th>Группа</th><th>Куратор</th><th>План, ч</th><th>Проведено, ч</th><th>Выполнение</th><th>Последнее мероприятие</th><th></th></tr>
                </thead>
                <tbody id="curTableBody"><tr><td colspan="7" class="text-muted">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="assignModal">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <h3 id="assignTitle">Назначить куратора</h3>
                <button type="button" class="close-btn" data-close="assignModal" aria-label="Закрыть">×</button>
            </div>
            <div class="modal-body">
                <div class="field" style="margin-bottom:14px;"><label for="assignGroup">Группа</label><select id="assignGroup"></select></div>
                <div class="field" style="margin-bottom:14px;"><label for="assignTeacher">Преподаватель</label><select id="assignTeacher"></select></div>
                <div class="field"><label for="assignHours">Кураторских часов в год</label><input type="number" id="assignHours" min="0" max="1000" value="36"></div>
                <p class="text-muted" style="font-size:12.5px; margin:12px 0 0;">У группы может быть только один куратор, у преподавателя может быть несколько групп.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" data-close="assignModal">Отмена</button>
                <button type="button" class="btn" id="assignSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cardModal">
        <div class="modal cur-modal-wide">
            <div class="modal-header">
                <h3>Кураторство группы</h3>
                <button type="button" class="close-btn" data-close="cardModal" aria-label="Закрыть">×</button>
            </div>
            <div class="modal-body">
                <div th:replace="~{fragments/curator-card :: card}"></div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/curator-card :: modals}"></div>

    <script th:src="@{/js/curatorship.js}"></script>
    <script>
    (function () {
        var yearSel = document.getElementById('curYearSelect');
        var rows = [];
        var teachers = [];
        var groups = [];
        var editing = null;

        function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
        function fmt(iso) { if (!iso) return '—'; var p = String(iso).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
        function toast(m, k) { if (typeof showToast === 'function') showToast(m, k); }
        function open(id) { document.getElementById(id).classList.add('active'); }
        function close(id) { document.getElementById(id).classList.remove('active'); }

        document.querySelectorAll('[data-close="assignModal"], [data-close="cardModal"]').forEach(function (b) {
            b.addEventListener('click', function () { close(b.dataset.close); });
        });

        function load() {
            return fetch('/api/curatorships/overview?year=' + encodeURIComponent(yearSel.value))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    rows = data.rows || [];
                    document.getElementById('statTotal').textContent = data.totalGroups;
                    document.getElementById('statWith').textContent = data.withCurator;
                    document.getElementById('statWithout').textContent = data.withoutCurator;
                    document.getElementById('statWithoutCard').classList.toggle('is-danger', data.withoutCurator > 0);
                    document.getElementById('statAvg').textContent = data.avgPercent + '%';
                    fillTeacherFilter();
                    render();
                })
                .catch(function () {
                    document.getElementById('curTableBody').innerHTML = '<tr><td colspan="7" class="text-danger">Не удалось загрузить</td></tr>';
                });
        }

        function fillTeacherFilter() {
            var sel = document.getElementById('curTeacherFilter');
            var keep = sel.value;
            var names = {};
            rows.forEach(function (r) { if (r.teacherId) names[r.teacherId] = r.teacherName; });
            sel.innerHTML = '<option value="">Все кураторы</option>';
            Object.keys(names).sort(function (a, b) { return names[a].localeCompare(names[b]); })
                .forEach(function (id) { sel.add(new Option(names[id], id)); });
            sel.value = keep;
        }

        function render() {
            var q = document.getElementById('curSearch').value.trim().toLowerCase();
            var teacher = document.getElementById('curTeacherFilter').value;
            var onlyFree = document.getElementById('curOnlyFree').checked;
            var list = rows.filter(function (r) {
                if (onlyFree && r.curatorshipId) return false;
                if (teacher && String(r.teacherId) !== teacher) return false;
                if (q && (r.groupName || '').toLowerCase().indexOf(q) < 0 && (r.teacherName || '').toLowerCase().indexOf(q) < 0) return false;
                return true;
            });
            var body = document.getElementById('curTableBody');
            if (!list.length) {
                body.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center; padding:20px;">Ничего не найдено</td></tr>';
                return;
            }
            body.innerHTML = list.map(function (r) {
                var group = '<b>' + esc(r.groupName) + '</b><div class="text-muted" style="font-size:12px;">'
                    + esc([r.specialty, r.course ? r.course + ' курс' : null].filter(Boolean).join(', ')) + '</div>';
                if (!r.curatorshipId) {
                    return '<tr><td>' + group + '</td><td><span class="chip chip-warning">Не назначен</span></td><td>—</td><td>—</td><td>—</td><td>—</td>'
                        + '<td><button type="button" class="btn btn-sm" data-assign="' + r.groupId + '">Назначить</button></td></tr>';
                }
                var pct = r.percent || 0;
                var fill = pct >= 90 ? '' : (pct >= 50 ? ' is-low' : ' is-over');
                return '<tr><td>' + group + '</td><td>' + esc(r.teacherName) + '</td><td>' + r.planHours + '</td>'
                    + '<td>' + Math.round(r.doneHours * 10) / 10 + '</td>'
                    + '<td><div class="cur-pct"><div class="progress-track"><div class="progress-fill' + fill + '" style="width:' + pct + '%"></div></div>' + pct + '%</div></td>'
                    + '<td>' + fmt(r.lastEventDate) + '</td>'
                    + '<td class="cur-actions"><button type="button" class="btn btn-sm" data-open="' + r.curatorshipId + '">Открыть</button>'
                    + '<button type="button" class="btn btn-sm btn-secondary" data-edit="' + r.curatorshipId + '">Изменить</button>'
                    + '<button type="button" class="btn btn-sm btn-ghost" data-remove="' + r.curatorshipId + '">Снять</button></td></tr>';
            }).join('');
            body.querySelectorAll('[data-assign]').forEach(function (b) {
                b.addEventListener('click', function () { openAssign(null, Number(b.dataset.assign)); });
            });
            body.querySelectorAll('[data-open]').forEach(function (b) {
                b.addEventListener('click', function () {
                    CuratorCard.open(Number(b.dataset.open)).then(function () { open('cardModal'); });
                });
            });
            body.querySelectorAll('[data-edit]').forEach(function (b) {
                b.addEventListener('click', function () { openAssign(Number(b.dataset.edit), null); });
            });
            body.querySelectorAll('[data-remove]').forEach(function (b) {
                b.addEventListener('click', function () { removeCurator(Number(b.dataset.remove)); });
            });
        }

        function loadRefs() {
            return Promise.all([
                fetch('/api/teachers').then(function (r) { return r.json(); }),
                fetch('/api/groups').then(function (r) { return r.json(); })
            ]).then(function (res) {
                teachers = (res[0] || []).sort(function (a, b) { return a.fullName.localeCompare(b.fullName); });
                groups = (res[1] || []).sort(function (a, b) { return a.name.localeCompare(b.name); });
            });
        }

        function openAssign(curatorshipId, groupId) {
            editing = curatorshipId;
            var row = curatorshipId ? rows.find(function (r) { return r.curatorshipId === curatorshipId; }) : null;
            var gSel = document.getElementById('assignGroup');
            var tSel = document.getElementById('assignTeacher');
            gSel.innerHTML = '';
            var free = groups.filter(function (g) {
                var r = rows.find(function (x) { return x.groupId === g.id; });
                return row ? g.id === row.groupId : !(r && r.curatorshipId);
            });
            free.forEach(function (g) { gSel.add(new Option(g.name, g.id)); });
            gSel.disabled = !!row;
            tSel.innerHTML = '';
            teachers.forEach(function (t) { tSel.add(new Option(t.fullName, t.id)); });
            if (row) {
                gSel.value = row.groupId;
                tSel.value = row.teacherId;
                document.getElementById('assignHours').value = row.planHours;
            } else {
                if (groupId) gSel.value = groupId;
                document.getElementById('assignHours').value = 36;
            }
            document.getElementById('assignTitle').textContent = row ? 'Изменить кураторство' : 'Назначить куратора';
            if (!free.length) { toast('У всех групп уже есть куратор', 'warning'); return; }
            open('assignModal');
        }

        document.getElementById('assignSaveBtn').addEventListener('click', function () {
            var payload = {
                teacherId: Number(document.getElementById('assignTeacher').value),
                groupId: Number(document.getElementById('assignGroup').value),
                hours: Number(document.getElementById('assignHours').value)
            };
            var url = editing ? '/api/curatorships/' + editing : '/api/curatorships';
            fetch(url, {method: editing ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
                .then(function (r) { return r.json().then(function (b) { return {ok: r.ok, body: b}; }); })
                .then(function (res) {
                    if (!res.ok) { toast((res.body && res.body.error) || 'Не удалось сохранить', 'danger'); return; }
                    close('assignModal');
                    toast('Сохранено', 'success');
                    load();
                })
                .catch(function () { toast('Ошибка сети', 'danger'); });
        });

        function removeCurator(id) {
            if (!confirm('Снять куратора с группы? Мероприятия и журнал этого кураторства удалятся.')) return;
            fetch('/api/curatorships/' + id, {method: 'DELETE'}).then(function (r) {
                if (r.ok) { toast('Куратор снят', 'success'); load(); } else toast('Не удалось', 'danger');
            });
        }

        CuratorCard.init({year: yearSel.value, onChange: function () { load(); }});

        document.getElementById('assignOpenBtn').addEventListener('click', function () { openAssign(null, null); });
        document.getElementById('curSearch').addEventListener('input', render);
        document.getElementById('curTeacherFilter').addEventListener('change', render);
        document.getElementById('curOnlyFree').addEventListener('change', render);
        yearSel.addEventListener('change', function () { CuratorCard.setYear(yearSel.value); load(); });

        loadRefs().then(load);
    })();
    </script>
</div>
</body>
</html>
