<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('settings', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Кураторство</h1>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <label class="select-control">
        Учебный год:
        <select id="curYearSelect">
            <option th:each="y : ${#numbers.sequence(defaultYear - 2, defaultYear)}"
                    th:value="${y}" th:text="${y} + '/' + ${y + 1}" th:selected="${y == defaultYear}"></option>
        </select>
    </label>
    <a class="topbar-bell" th:href="@{/notifications}" aria-label="Уведомления">
        <span th:replace="~{fragments/icons :: bell}"></span>
    </a>
</div>

<div th:fragment="pageContent" class="app-content">
    <div class="cur-layout">
        <div class="cur-sidebar" id="curGroupList">
            <p class="text-muted">Загрузка...</p>
        </div>
        <div class="cur-main">
            <div th:replace="~{fragments/curator-card :: card}"></div>
            <div class="card" id="curEmpty" style="display:none;">
                <div class="empty-state">
                    <p class="empty-state-title">За вами пока не закреплена ни одна группа</p>
                    <p>Куратора назначает администратор в разделе «Кураторство».</p>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/curator-card :: modals}"></div>

    <script th:src="@{/js/curatorship.js}"></script>
    <script>
    (function () {
        var list = [];
        var activeId = null;
        var yearSel = document.getElementById('curYearSelect');

        function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

        function renderList() {
            var box = document.getElementById('curGroupList');
            var year = Number(yearSel.value);
            box.innerHTML = list.map(function (c) {
                var plan = c.hours || 0;
                var done = CuratorCard.doneHours(c, year);
                var pct = plan > 0 ? Math.min(100, done * 100 / plan) : 0;
                return '<button type="button" class="cur-group-item' + (c.id === activeId ? ' active' : '') + '" data-id="' + c.id + '">'
                    + '<div class="cur-group-name">' + esc(c.group.name) + '</div>'
                    + '<div class="cur-group-sub">' + esc([c.group.specialty, c.group.course ? c.group.course + ' курс' : null].filter(Boolean).join(', '))
                    + ' · ' + Math.round(done * 10) / 10 + ' из ' + plan + ' ч</div>'
                    + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div></button>';
            }).join('');
            box.querySelectorAll('[data-id]').forEach(function (b) {
                b.addEventListener('click', function () { select(Number(b.dataset.id)); });
            });
        }

        function select(id) {
            activeId = id;
            var c = list.find(function (x) { return x.id === id; });
            renderList();
            if (c) CuratorCard.show(c);
        }

        CuratorCard.init({
            year: yearSel.value,
            onChange: function (c) {
                list = list.map(function (x) { return x.id === c.id ? c : x; });
                renderList();
            }
        });

        yearSel.addEventListener('change', function () {
            CuratorCard.setYear(yearSel.value);
            renderList();
        });

        fetch('/api/curatorships/my').then(function (r) { return r.ok ? r.json() : []; }).then(function (data) {
            list = (data || []).sort(function (a, b) { return a.group.name.localeCompare(b.group.name); });
            if (!list.length) {
                document.getElementById('curGroupList').style.display = 'none';
                document.getElementById('curEmpty').style.display = '';
                return;
            }
            select(list[0].id);
        }).catch(function () {
            document.getElementById('curGroupList').innerHTML = '<p class="text-danger">Не удалось загрузить</p>';
        });
    })();
    </script>
</div>
</body>
</html>
