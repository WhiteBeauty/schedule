<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body { display: block; background: var(--bg); }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            width: 380px;
        }
        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.35rem;
        }
        .auth-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 1.5rem;
        }
        .auth-notice {
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm);
        }
        .auth-notice.error { background: var(--danger-bg); color: var(--danger); }
        .auth-notice.success { background: var(--success-bg); color: var(--success); }
        .auth-divider {
            text-align: center;
            margin: 1.25rem 0;
            color: var(--muted);
            font-size: 0.8rem;
            position: relative;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: var(--border);
        }
        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }
        .auth-links {
            text-align: center;
            font-size: 0.85rem;
        }
        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover { text-decoration: underline; }
        .btn-block { width: 100%; }
    </style>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1 class="auth-title">Учёт нагрузки</h1>
        <p class="auth-subtitle">Вход в личный кабинет</p>

        <div th:if="${param.error}" class="auth-notice error">
            Неверный email или пароль
        </div>
        <div th:if="${param.logout}" class="auth-notice success">
            Вы успешно вышли из системы
        </div>
        <div th:if="${param.registered}" class="auth-notice success">
            Регистрация успешна. Войдите с помощью email и пароля
        </div>

        <form th:action="@{/login}" method="post" id="login-form" novalidate>
            <div class="field" id="field-email">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="username">
                <div class="field-error" id="error-email" style="display:none;"></div>
            </div>
            <div class="field" id="field-password">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Введите пароль" autocomplete="current-password">
                <div class="field-error" id="error-password" style="display:none;"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>

        <div class="auth-divider">или</div>

        <div class="auth-links">
            <a th:href="@{/register}">Создать учётную запись</a>
        </div>
    </div>
</div>
<script>
    (function () {
        var form = document.getElementById('login-form');
        var email = document.getElementById('email');
        var password = document.getElementById('password');

        function setError(input, fieldId, errorId, message) {
            var field = document.getElementById(fieldId);
            var error = document.getElementById(errorId);
            if (message) {
                field.classList.add('has-error');
                error.textContent = message;
                error.style.display = 'block';
            } else {
                field.classList.remove('has-error');
                error.style.display = 'none';
            }
        }

        function validateEmail() {
            if (!email.value) {
                setError(email, 'field-email', 'error-email', 'Укажите email');
                return false;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                setError(email, 'field-email', 'error-email', 'Проверьте формат email');
                return false;
            }
            setError(email, 'field-email', 'error-email', null);
            return true;
        }

        function validatePassword() {
            if (!password.value) {
                setError(password, 'field-password', 'error-password', 'Введите пароль');
                return false;
            }
            setError(password, 'field-password', 'error-password', null);
            return true;
        }

        email.addEventListener('blur', validateEmail);
        password.addEventListener('blur', validatePassword);

        form.addEventListener('submit', function (e) {
            var emailOk = validateEmail();
            var passwordOk = validatePassword();
            if (!emailOk || !passwordOk) e.preventDefault();
        });
    })();
</script>
</body>
</html>
