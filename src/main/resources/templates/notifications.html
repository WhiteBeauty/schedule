<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('notifications', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Уведомления</h1>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <a class="btn btn-secondary btn-sm" id="markAllBtn" onclick="markAllRead(this)">Отметить все прочитанным</a>
</div>

<div th:fragment="pageContent" class="app-content">
    <style>
        .notif-card {
            background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card);
            padding: 16px 20px; margin-bottom: 12px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .notif-card.unread { border-left: 4px solid var(--color-primary); }
        .notif-card.removing { opacity: 0; transform: translateX(12px); }
        .notif-title { font-weight: 600; margin-bottom: 4px; }
        .notif-message { font-size: 14px; color: var(--color-text-muted); white-space: pre-wrap; }
        .notif-time { font-size: 12px; color: var(--color-text-faint); margin-top: 6px; }
        .notif-actions { margin-top: 12px; display: flex; gap: 8px; }
        .notif-mark-btn { margin-top: 12px; }
    </style>

    <p class="page-heading-sub" style="margin:0;">Заявки на замену и системные сообщения модуля форс-мажоров и импорта.</p>

    <div class="segmented" style="width:fit-content;">
        <button type="button" class="active" id="tabUnread" onclick="switchTab('unread')">Непрочитанные</button>
        <button type="button" id="tabAll" onclick="switchTab('all')">Все</button>
    </div>

    <div id="list"><span class="skeleton skeleton-row"></span></div>

    <script th:inline="javascript">
        const list = document.getElementById('list');
        let allItems = [];
        let currentTab = 'unread';

        async function load() {
            const res = await fetch('/api/notifications');
            allItems = await res.json();
            render();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabUnread').classList.toggle('active', tab === 'unread');
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            render();
        }

        function render() {
            const items = currentTab === 'unread' ? allItems.filter(n => !n.isRead) : allItems;
            list.innerHTML = '';
            if (!items.length) {
                list.innerHTML = currentTab === 'unread'
                    ? '<div class="empty-state"><p class="empty-state-title">Непрочитанных уведомлений нет</p></div>'
                    : '<div class="empty-state"><p class="empty-state-title">Уведомлений пока нет</p></div>';
                return;
            }
            items.forEach(n => list.appendChild(buildCard(n)));
        }

        function buildCard(n) {
            const card = document.createElement('div');
            card.className = 'notif-card' + (n.isRead ? '' : ' unread');
            card.dataset.id = n.id;

            let actions = '';
            if (n.type === 'SUBSTITUTION_REQUEST' && !n.isRead) {
                actions = '<div class="notif-actions">' +
                    '<button class="btn btn-sm" onclick="respond(' + n.substitutionRequestId + ', \'accept\', this)">Подтвердить замену</button>' +
                    '<button class="btn btn-sm btn-secondary" onclick="respond(' + n.substitutionRequestId + ', \'decline\', this)">Отклонить</button>' +
                    '</div>';
            } else if (n.type === 'PACE_ADJUSTMENT_SUGGESTED' && !n.isRead) {
                actions = '<div class="notif-actions">' +
                    '<button class="btn btn-sm" onclick="respondPace(' + n.paceAdjustmentId + ', \'accept\', this)">Применить</button>' +
                    '<button class="btn btn-sm btn-secondary" onclick="respondPace(' + n.paceAdjustmentId + ', \'decline\', this)">Отклонить</button>' +
                    '</div>';
            }

            const markBtn = !n.isRead
                ? '<div class="notif-mark-btn"><button class="btn btn-sm btn-secondary" onclick="markRead(' + n.id + ', this)">Отметить прочитанным</button></div>'
                : '';

            card.innerHTML =
                '<div class="notif-title">' + escapeHtml(n.title) + '</div>' +
                '<div class="notif-message">' + escapeHtml(n.message || '') + '</div>' +
                '<div class="notif-time">' + formatDate(n.createdAt) + '</div>' +
                actions + markBtn;

            return card;
        }

        async function markRead(id, btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch('/api/notifications/' + id + '/read', { method: 'POST' });
                if (!res.ok) {
                    if (btn) btn.disabled = false;
                    return;
                }
                const item = allItems.find(n => n.id === id);
                if (item) item.isRead = true;

                const card = list.querySelector('[data-id="' + id + '"]');
                if (card && currentTab === 'unread') {
                    card.classList.add('removing');
                    setTimeout(() => card.remove(), 250);
                } else if (card) {
                    card.classList.remove('unread');
                    const actions = card.querySelector('.notif-mark-btn');
                    if (actions) actions.remove();
                }
            } catch (e) {
                if (btn) btn.disabled = false;
            }
        }

        async function markAllRead(btn) {
            if (btn) btn.disabled = true;
            try {
                const res = await fetch('/api/notifications/mark-all-read', { method: 'POST' });
                if (!res.ok) {
                    if (btn) btn.disabled = false;
                    return;
                }
                allItems.forEach(n => n.isRead = true);
                render();
                const badge = document.getElementById('bellBadge');
                if (badge) badge.style.display = 'none';
            } catch (e) {
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function respond(requestId, action, btn) {
            btn.disabled = true;
            try {
                const res = await fetch('/api/substitutions/' + requestId + '/' + action, { method: 'POST' });
                if (!res.ok) {
                    showToast('Не удалось выполнить действие', 'danger');
                    btn.disabled = false;
                    return;
                }
                await load();
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'danger');
                btn.disabled = false;
            }
        }

        async function respondPace(suggestionId, action, btn) {
            btn.disabled = true;
            try {
                const res = await fetch('/api/pace-adjustments/' + suggestionId + '/' + action, { method: 'POST' });
                if (!res.ok) {
                    showToast('Не удалось выполнить действие', 'danger');
                    btn.disabled = false;
                    return;
                }
                showToast(action === 'accept' ? 'Темп скорректирован' : 'Предложение отклонено', 'success');
                await load();
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'danger');
                btn.disabled = false;
            }
        }

        function formatDate(s) {
            if (!s) return '';
            try {
                const d = new Date(s);
                return d.toLocaleString('ru-RU');
            } catch (e) { return s; }
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        load();
    </script>
</div>
</body>
</html>
