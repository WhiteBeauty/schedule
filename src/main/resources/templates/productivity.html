<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('reports', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Продуктивность преподавателей</h1>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <a class="topbar-bell" th:href="@{/notifications}" aria-label="Уведомления">
        <span th:replace="~{fragments/icons :: bell}"></span>
    </a>
</div>

<div th:fragment="pageContent" class="app-content">
    <style>
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.success { background: var(--color-success-text); }
        .status-dot.warning { background: var(--color-warning-text); }
        .status-dot.danger { background: var(--color-danger-text); }
    </style>

    <div class="card">
        <div class="card-header">
            <span class="card-title">Расчётный индекс продуктивности за <span id="yearLabel" th:text="${year}">2025</span></span>
            <div class="filters">
                <label class="select-control">Год
                    <select id="yearSelect"><option th:each="y : ${#numbers.sequence(year - 1, year + 3)}" th:value="${y}" th:text="${y}" th:selected="${y == year}"></option></select>
                </label>
                <button type="button" class="btn btn-sm btn-secondary" onclick="loadProductivity()">Обновить</button>
            </div>
        </div>
        <p class="page-heading-sub">Формула по умолчанию: (Вычитано/План)×0.6 + (Своевременность КР/Всего КР)×0.4 × 100</p>
        <table class="data-table" id="prodTable">
            <thead>
            <tr>
                <th>#</th>
                <th>Преподаватель</th>
                <th>Индекс продуктивности</th>
                <th>% выполнения плана</th>
                <th>Своевременность КР</th>
                <th>Индикатор</th>
            </tr>
            </thead>
            <tbody id="prodBody"></tbody>
        </table>
    </div>

    <div class="metric-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="metric-card" style="border-left:4px solid var(--color-success-text)">
            <div class="metric-label">Высокая (≥90%)</div>
            <div class="metric-value" id="countHigh">0</div>
        </div>
        <div class="metric-card" style="border-left:4px solid var(--color-warning-text)">
            <div class="metric-label">Средняя (70–89%)</div>
            <div class="metric-value" id="countMid">0</div>
        </div>
        <div class="metric-card" style="border-left:4px solid var(--color-danger-text)">
            <div class="metric-label">Низкая (&lt;70%)</div>
            <div class="metric-value" id="countLow">0</div>
        </div>
    </div>

    <script>
    function loadProductivity() {
        const year = document.getElementById('yearSelect').value;
        document.getElementById('yearLabel').textContent = year;

        fetch(`/api/productivity?year=${year}`)
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('prodBody');
                tbody.innerHTML = '';

                let high = 0, mid = 0, low = 0;

                data.forEach((p, idx) => {
                    if (p.color === 'success') high++;
                    else if (p.color === 'warning') mid++;
                    else low++;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${p.teacherName}</td>
                        <td><strong>${p.productivityIndex}%</strong></td>
                        <td>${p.planCompletionPercent}%</td>
                        <td>${p.timelinessPercent}%</td>
                        <td><span class="status-dot ${p.color}"></span></td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('countHigh').textContent = high;
                document.getElementById('countMid').textContent = mid;
                document.getElementById('countLow').textContent = low;
            });
    }

    document.addEventListener('DOMContentLoaded', loadProductivity);
    </script>
</div>
</body>
</html>
