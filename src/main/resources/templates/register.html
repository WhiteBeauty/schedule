<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body { display: block; background: var(--bg); }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            width: 440px;
            max-height: 95vh;
            overflow-y: auto;
        }
        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.35rem;
        }
        .auth-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 1.5rem;
        }
        .auth-notice.error {
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 0.85rem;
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.25rem;
        }
        .row { display: flex; gap: 0.75rem; }
        .row .field { flex: 1; }
        .auth-links { margin-top: 1.25rem; text-align: center; font-size: 0.85rem; }
        .auth-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-links a:hover { text-decoration: underline; }
        .btn-block { width: 100%; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1 class="auth-title">Учёт нагрузки</h1>
        <p class="auth-subtitle">Создание учётной записи</p>

        <div th:if="${error}" class="auth-notice error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${request}" method="post" id="register-form" novalidate>
            <div class="row">
                <div class="field" id="field-lastName">
                    <label for="lastName">Фамилия *</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required placeholder="Иванов">
                    <div class="field-error" id="error-lastName" style="display:none;"></div>
                </div>
                <div class="field" id="field-firstName">
                    <label for="firstName">Имя *</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required placeholder="Иван">
                    <div class="field-error" id="error-firstName" style="display:none;"></div>
                </div>
            </div>

            <div class="field" id="field-username">
                <label for="username">Логин *</label>
                <input type="text" id="username" th:field="*{username}" required placeholder="ivanov_sp">
                <div class="field-error" id="error-username" style="display:none;"></div>
            </div>

            <div class="field" id="field-email">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" required placeholder="ivanov@university.ru">
                <div class="field-error" id="error-email" style="display:none;"></div>
            </div>

            <div class="field">
                <label for="phone">Телефон</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="+79991234567">
            </div>

            <div class="field">
                <label for="birthDate">Дата рождения</label>
                <input type="date" id="birthDate" th:field="*{birthDate}">
            </div>

            <div class="row">
                <div class="field" id="field-password">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" th:field="*{password}" required placeholder="Минимум 6 символов">
                    <div class="field-error" id="error-password" style="display:none;"></div>
                </div>
                <div class="field" id="field-confirmPassword">
                    <label for="confirmPassword">Подтвердите пароль *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required placeholder="Повторите пароль">
                    <div class="field-error" id="error-confirmPassword" style="display:none;"></div>
                </div>
            </div>

            <p class="field-hint">
                Регистрация создаёт аккаунт преподавателя. Права администратора выдаются
                только действующим администратором из раздела «Пользователи».
            </p>

            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>

        <div class="auth-links">
            Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
        </div>
    </div>
</div>
<script>
    (function () {
        var form = document.getElementById('register-form');

        function setError(fieldId, errorId, message) {
            var field = document.getElementById(fieldId);
            var error = document.getElementById(errorId);
            if (message) {
                field.classList.add('has-error');
                error.textContent = message;
                error.style.display = 'block';
            } else {
                field.classList.remove('has-error');
                error.style.display = 'none';
            }
        }

        function required(id, fieldId, errorId, label) {
            var input = document.getElementById(id);
            if (!input.value.trim()) {
                setError(fieldId, errorId, label + ' обязательно для заполнения');
                return false;
            }
            setError(fieldId, errorId, null);
            return true;
        }

        function validateEmail() {
            var email = document.getElementById('email');
            if (!email.value) {
                setError('field-email', 'error-email', 'Укажите email');
                return false;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                setError('field-email', 'error-email', 'Проверьте формат email');
                return false;
            }
            setError('field-email', 'error-email', null);
            return true;
        }

        function validatePassword() {
            var password = document.getElementById('password');
            if (password.value.length < 6) {
                setError('field-password', 'error-password', 'Минимум 6 символов');
                return false;
            }
            setError('field-password', 'error-password', null);
            return true;
        }

        function validateConfirm() {
            var password = document.getElementById('password');
            var confirm = document.getElementById('confirmPassword');
            if (confirm.value !== password.value) {
                setError('field-confirmPassword', 'error-confirmPassword', 'Пароли не совпадают');
                return false;
            }
            setError('field-confirmPassword', 'error-confirmPassword', null);
            return true;
        }

        document.getElementById('lastName').addEventListener('blur', function () {
            required('lastName', 'field-lastName', 'error-lastName', 'Фамилия');
        });
        document.getElementById('firstName').addEventListener('blur', function () {
            required('firstName', 'field-firstName', 'error-firstName', 'Имя');
        });
        document.getElementById('username').addEventListener('blur', function () {
            required('username', 'field-username', 'error-username', 'Логин');
        });
        document.getElementById('email').addEventListener('blur', validateEmail);
        document.getElementById('password').addEventListener('blur', validatePassword);
        document.getElementById('confirmPassword').addEventListener('blur', validateConfirm);

        form.addEventListener('submit', function (e) {
            var ok = true;
            ok = required('lastName', 'field-lastName', 'error-lastName', 'Фамилия') && ok;
            ok = required('firstName', 'field-firstName', 'error-firstName', 'Имя') && ok;
            ok = required('username', 'field-username', 'error-username', 'Логин') && ok;
            ok = validateEmail() && ok;
            ok = validatePassword() && ok;
            ok = validateConfirm() && ok;
            if (!ok) e.preventDefault();
        });
    })();
</script>
</body>
</html>
