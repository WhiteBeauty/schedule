<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('schedule', ~{::topbarLeft}, ~{::topbarRight}, ~{::pageContent})}">
<head></head>
<body>

<div th:fragment="topbarLeft" class="topbar-left">
    <h1 class="topbar-title">Расписание</h1>
    <span class="chip chip-warning" id="draftChip" style="display:none;">Просмотр черновика</span>
</div>

<div th:fragment="topbarRight" class="topbar-right">
    <a class="topbar-bell" th:href="@{/notifications}" aria-label="Уведомления">
        <span th:replace="~{fragments/icons :: bell}"></span>
        <span class="topbar-bell-badge" id="bellBadge" style="display:none;">0</span>
    </a>
</div>

<div th:fragment="pageContent" class="app-content">
    <div class="control-bar">
        <div class="control-bar-group">
            <div class="segmented" id="modeSegmented">
                <button type="button" class="active" data-mode="group">По группам</button>
                <button type="button" data-mode="teacher">По преподавателям</button>
                <button type="button" data-mode="room">По аудиториям</button>
            </div>
            <label class="select-control">
                <span th:replace="~{fragments/icons :: filter}"></span>
                <select id="entitySelect"></select>
            </label>
        </div>
        <div class="control-bar-group">
            <div class="week-nav">
                <button type="button" class="week-nav-btn" id="weekPrev" aria-label="Предыдущая неделя">
                    <span th:replace="~{fragments/icons :: chevron-left}"></span>
                </button>
                <span class="week-nav-range" id="weekRange">—</span>
                <button type="button" class="week-nav-btn" id="weekNext" aria-label="Следующая неделя">
                    <span th:replace="~{fragments/icons :: chevron-right}"></span>
                </button>
            </div>
            <label class="select-control">
                Учебный год:
                <select id="yearSelect">
                    <option th:each="y : ${#numbers.sequence(year - 1, year + 3)}"
                            th:value="${y}" th:text="${y} + '/' + ${y + 1}" th:selected="${y == year}"></option>
                </select>
            </label>
            <a class="btn btn-secondary" th:if="${isAdmin}" th:href="@{/admin/schedule}">
                <span th:replace="~{fragments/icons :: download}"></span>Скачать расписание
            </a>
            <a class="btn btn-secondary" th:href="@{/reports}">
                <span th:replace="~{fragments/icons :: bar-chart}"></span>Отчёты
            </a>
            <a class="btn" th:if="${isAdmin}" th:href="@{/admin/schedule}">
                <span th:replace="~{fragments/icons :: plus}"></span>Сгенерировать
            </a>
        </div>
    </div>

    <div th:if="${isAdmin}" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <div th:replace="~{fragments/special-event-modal :: modal}"></div>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="week-grid" id="weekGrid">
            <div class="week-grid-head">
                <div class="week-grid-head-cell"></div>
                <div class="week-grid-head-cell">Понедельник</div>
                <div class="week-grid-head-cell">Вторник</div>
                <div class="week-grid-head-cell">Среда</div>
                <div class="week-grid-head-cell">Четверг</div>
                <div class="week-grid-head-cell">Пятница</div>
                <div class="week-grid-head-cell">Суббота</div>
            </div>
            <div id="weekGridBody" style="display:contents;"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="legend-swatch" style="background:var(--lesson-lecture-bg);"></span>Лекция</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--lesson-practice-bg);"></span>Практика</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--lesson-lab-bg);"></span>Лабораторная</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--lesson-conflict-bg); border:1.5px dashed #C1443C;"></span>Конфликт</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--substitute);"></span>Замена</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--color-danger-bg);"></span>Экзамен, практика, вождение</div>
        </div>
    </div>

    <style>
        .week-event-cell { padding: 6px; border-left: 1px solid var(--color-border-light); border-bottom: 1px solid var(--color-border-light); }
        .week-event {
            height: 100%; min-height: 120px; border-radius: var(--radius-mini); background: var(--color-danger-bg);
            color: var(--color-danger-text); display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 10px;
        }
        .week-event.practice { background: var(--color-warning-bg); color: var(--color-warning-text); }
        .week-event.driving { background: #E1EEF1; color: var(--color-primary); }
        .week-event-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; overflow-wrap: anywhere; }
        .week-event-sub { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
        .lesson-card.is-cancelled { opacity: 0.45; text-decoration: line-through; }
        .lesson-card.is-substituted { box-shadow: inset 3px 0 0 var(--substitute); }
    </style>
    <script th:inline="javascript">
(function () {
    const isAdmin = /*[[${isAdmin}]]*/ false;
    const myTeacherId = /*[[${teacherId}]]*/ null;
    const DAY_KEYS = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const MONTH_NAMES_RU = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    const STANDARD_SLOTS = ['08:00-09:35', '09:40-11:25', '11:40-13:25', '13:35-15:10', '15:15-16:50'];

    let mode = 'group';
    let weekData = {lessons: [], events: []};
    let groupsData = [];
    let teachersData = [];
    let roomsData = [];
    let weekMonday = mondayOf(new Date());
    let requestNo = 0;

    function mondayOf(date) {
        const monday = new Date(date);
        monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
        monday.setHours(0, 0, 0, 0);
        return monday;
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function fmtDate(d) { return d.getDate() + ' ' + MONTH_NAMES_RU[d.getMonth()]; }

    function updateWeekLabel() {
        document.getElementById('weekRange').textContent = fmtDate(weekMonday) + ' – ' + fmtDate(addDays(weekMonday, 5));
    }

    function loadRefs() {
        return Promise.all([
            fetch('/api/groups').then(r => r.json()),
            fetch('/api/teachers').then(r => r.json()),
            fetch('/api/classrooms').then(r => r.json()).catch(() => [])
        ]).then(([groups, teachers, rooms]) => {
            groupsData = groups || [];
            teachersData = teachers || [];
            roomsData = rooms || [];
            if (!isAdmin && myTeacherId) {
                mode = 'teacher';
                document.querySelectorAll('#modeSegmented button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'teacher'));
            }
            populateEntitySelect();
            if (!isAdmin && myTeacherId) document.getElementById('entitySelect').value = myTeacherId;
            applyInitialSearch();
        });
    }

    function loadWeek() {
        updateWeekLabel();
        const from = iso(weekMonday);
        const to = iso(addDays(weekMonday, 5));
        const no = ++requestNo;
        return fetch('/api/schedule/range?from=' + from + '&to=' + to)
            .then(r => r.ok ? r.json() : {lessons: [], events: []})
            .then(data => {
                if (no !== requestNo) return;
                weekData = data || {lessons: [], events: []};
                renderGrid();
            })
            .catch(() => {
                document.getElementById('weekGridBody').innerHTML =
                    '<div style="grid-column:1/-1; padding:2rem;" class="empty-state">Не удалось загрузить расписание</div>';
            });
    }

    function applyInitialSearch() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (!q || !q.trim()) return;
        const needle = q.trim().toLowerCase();
        const teacherMatch = teachersData.find(t => (t.fullName || '').toLowerCase().includes(needle));
        const groupMatch = groupsData.find(g => (g.name || '').toLowerCase().includes(needle));
        if (teacherMatch) {
            setMode('teacher');
            document.getElementById('entitySelect').value = teacherMatch.id;
        } else if (groupMatch) {
            setMode('group');
            document.getElementById('entitySelect').value = groupMatch.id;
        } else {
            showToast('Ничего не найдено по запросу «' + q + '»', 'warning');
        }
        const url = new URL(window.location.href);
        url.searchParams.delete('q');
        window.history.replaceState({}, '', url);
    }

    function setMode(m) {
        mode = m;
        document.querySelectorAll('#modeSegmented button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
        populateEntitySelect();
    }

    function populateEntitySelect() {
        const select = document.getElementById('entitySelect');
        const previous = select.value;
        select.innerHTML = '';
        let items = [];
        if (mode === 'group') {
            items = groupsData.map(g => ({ id: g.id, label: g.name + (g.course ? ' (' + g.course + ' курс)' : '') }));
        } else if (mode === 'teacher') {
            items = teachersData.map(t => ({ id: t.id, label: t.fullName }));
        } else {
            const names = Array.from(new Set(roomsData.length ? roomsData.map(r => r.name)
                : (weekData.lessons || []).map(p => p.classroom).filter(Boolean))).sort();
            items = names.map(n => ({ id: n, label: 'Ауд. ' + n }));
        }
        items.forEach(item => select.add(new Option(item.label, item.id)));
        if (items.some(i => String(i.id) === previous)) select.value = previous;
    }

    function categoryClass(lessonType) {
        const t = (lessonType || '').toLowerCase();
        if (t.indexOf('лаб') !== -1) return 'lesson-lab';
        if (t.indexOf('практ') !== -1) return 'lesson-practice';
        return 'lesson-lecture';
    }

    function matches(l, value) {
        if (mode === 'group') return String(l.groupId) === String(value);
        if (mode === 'teacher') return String(l.actualTeacherId) === String(value) || String(l.teacherId) === String(value);
        return l.classroom === value;
    }

    function eventClass(type) {
        if (type === 'DRIVING') return 'driving';
        if (type === 'STUDY_PRACTICE' || type === 'PRODUCTION_PRACTICE') return 'practice';
        return '';
    }

    function renderGrid() {
        updateWeekLabel();
        const entityValue = document.getElementById('entitySelect').value;
        const body = document.getElementById('weekGridBody');
        body.innerHTML = '';

        if (!entityValue) {
            body.innerHTML = '<div style="grid-column:1/-1;" class="empty-state"><p class="empty-state-title">Выберите значение фильтра</p></div>';
            return;
        }

        const relevant = (weekData.lessons || []).filter(l => matches(l, entityValue));
        const eventByDay = {};
        if (mode === 'group') {
            DAY_KEYS.forEach((day, idx) => {
                const date = iso(addDays(weekMonday, idx));
                const ev = (weekData.events || []).find(e => String(e.groupId) === String(entityValue)
                    && e.startDate <= date && e.endDate >= date);
                if (ev) eventByDay[idx] = ev;
            });
        }

        const used = Array.from(new Set(relevant.map(p => p.startTime.substring(0, 5) + '-' + p.endTime.substring(0, 5))));
        let lastStandard = used.reduce((max, s) => Math.max(max, STANDARD_SLOTS.indexOf(s)), -1);
        if (Object.keys(eventByDay).length) lastStandard = Math.max(lastStandard, 3);
        const slots = STANDARD_SLOTS.slice(0, lastStandard + 1)
            .concat(used.filter(s => STANDARD_SLOTS.indexOf(s) < 0))
            .sort();

        if (!slots.length) {
            body.innerHTML = '<div style="grid-column:1/-1;" class="empty-state"><p class="empty-state-title">Нет пар</p><p>На эту неделю пары не найдены</p></div>';
            return;
        }

        slots.forEach((slot, rowIdx) => {
            const timeCell = document.createElement('div');
            timeCell.className = 'week-time-cell';
            timeCell.style.gridColumn = '1';
            timeCell.style.gridRow = String(rowIdx + 2);
            const pairNo = STANDARD_SLOTS.indexOf(slot);
            timeCell.innerHTML = '<div>' + (pairNo >= 0 ? (pairNo + 1) + ' пара' : 'вне сетки') + '</div><div>' + slot + '</div>';
            body.appendChild(timeCell);

            DAY_KEYS.forEach((day, dayIdx) => {
                const ev = eventByDay[dayIdx];
                if (ev) {
                    if (rowIdx !== 0) return;
                    const cell = document.createElement('div');
                    cell.className = 'week-event-cell';
                    cell.style.gridColumn = String(dayIdx + 2);
                    cell.style.gridRow = '2 / span ' + slots.length;
                    cell.innerHTML = '<div class="week-event ' + eventClass(ev.type) + '"><div class="week-event-title">'
                        + escapeHtml(ev.typeLabel) + '</div>'
                        + (ev.disciplineName ? '<div class="week-event-sub">' + escapeHtml(ev.disciplineName) + '</div>' : '')
                        + '<div class="week-event-sub" style="font-weight:500;">пар нет</div></div>';
                    body.appendChild(cell);
                    return;
                }
                const date = iso(addDays(weekMonday, dayIdx));
                const cell = document.createElement('div');
                cell.className = 'week-day-cell';
                cell.style.gridColumn = String(dayIdx + 2);
                cell.style.gridRow = String(rowIdx + 2);
                const cellPairs = relevant.filter(p => p.date === date &&
                    (p.startTime.substring(0, 5) + '-' + p.endTime.substring(0, 5)) === slot);
                const active = cellPairs.filter(p => p.status !== 'CANCELLED' && p.status !== 'INDEPENDENT_WORK');
                const conflict = active.length > 1;
                cellPairs.forEach(p => {
                    const cancelled = p.status === 'CANCELLED' || p.status === 'INDEPENDENT_WORK';
                    const card = document.createElement('div');
                    card.className = 'lesson-card ' + (conflict && !cancelled ? 'lesson-conflict' : categoryClass(p.lessonType))
                        + (cancelled ? ' is-cancelled' : '') + (p.substituted ? ' is-substituted' : '');
                    if (p.note) card.title = p.note;
                    const who = mode === 'teacher'
                        ? p.groupName
                        : (p.substituted ? p.actualTeacherName + ' (замена)' : p.originalTeacherName);
                    card.innerHTML =
                        '<div class="lesson-card-title">' + (conflict && !cancelled ? iconWarningSvg() : '') +
                        escapeHtml(p.disciplineName) + '</div>' +
                        '<div class="lesson-card-meta">' + escapeHtml(p.classroom || '') + ' · ' + escapeHtml(who || '—') + '</div>' +
                        (p.movedFrom ? '<div class="lesson-card-meta">перенос с ' + p.movedFrom.split('-').reverse().slice(0, 2).join('.') + '</div>' : '');
                    cell.appendChild(card);
                });
                body.appendChild(cell);
            });
        });
    }

    function iconWarningSvg() {
        return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s == null ? '' : s;
        return div.innerHTML;
    }

    document.getElementById('modeSegmented').addEventListener('click', function (e) {
        const btn = e.target.closest('button[data-mode]');
        if (!btn) return;
        setMode(btn.dataset.mode);
        renderGrid();
    });

    document.getElementById('entitySelect').addEventListener('change', renderGrid);
    document.getElementById('yearSelect').addEventListener('change', function () {
        const y = Number(this.value);
        window.DEFAULT_ACADEMIC_YEAR = y;
        const start = new Date(y, 8, 1);
        const end = new Date(y + 1, 5, 30);
        if (weekMonday < mondayOf(start) || weekMonday > end) {
            weekMonday = mondayOf(start);
            loadWeek();
        }
    });
    document.getElementById('weekPrev').addEventListener('click', function () {
        weekMonday = addDays(weekMonday, -7);
        loadWeek();
    });
    document.getElementById('weekNext').addEventListener('click', function () {
        weekMonday = addDays(weekMonday, 7);
        loadWeek();
    });

    fetch('/api/notifications/unread-count')
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            if (!data) return;
            var badge = document.getElementById('bellBadge');
            if (data.unread > 0) { badge.style.display = 'flex'; badge.textContent = data.unread; }
        }).catch(function () {});

    window.onSpecialEventChanged = loadWeek;
    window.DEFAULT_ACADEMIC_YEAR = Number(document.getElementById('yearSelect').value);
    loadRefs().then(loadWeek);
})();
</script>
</div>
</body>
</html>
